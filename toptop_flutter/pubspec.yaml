name: toptop_flutter
description: "TopTop - TikTok Clone Flutter App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_database: ^12.0.0

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # UI
  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  video_player: ^2.8.2
  visibility_detector: ^0.4.0+2
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  google_generative_ai: ^0.3.0
  http: ^1.2.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
